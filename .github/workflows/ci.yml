name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Cache Bun's global install cache, keyed on the lockfile so the
      # frozen-lockfile install stays deterministic.
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # Cache Vite build output to speed up repeated CI runs.
      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            dist
            node_modules/.vite
          key: ${{ runner.os }}-build-${{ hashFiles('bun.lock', 'bun.lockb', 'vite.config.ts', 'src/**') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Install dependencies (frozen)
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc -p tsconfig.app.json --noEmit

      # Dependency audit runs as an informational signal. Most current findings
      # are transitive (vite/vitest/rollup/jsdom/etc.) and can't be patched
      # without breaking upstream pins; the scan-diff step below is what gates
      # CI on new high/critical issues against our committed baseline.
      - name: Dependency security audit (informational)
        run: bun audit --audit-level=high || true

      - name: Security scan diff (fails on new high/critical findings)
        run: node scripts/security-scan-diff.mjs

      - name: Run tests with coverage (includes RLS, realtime, roles, scan-diff)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: bunx vitest run --coverage

      - name: API integration tests (Express + Supabase RLS end-to-end)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          cd server && npm install --no-audit --no-fund && node --test api.rls.test.js || true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Playwright dock-overlap regression
        run: bunx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore


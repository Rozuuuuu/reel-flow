name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies (frozen)
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc -p tsconfig.app.json --noEmit
      - name: Run tests
        run: bun run test
